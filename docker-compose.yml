services:
  db:
    image: postgis/postgis:15-3.3
    container_name: jehostarter_db
    environment:
      POSTGRES_DB: jehostarter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Benjamin*247}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  pgdata:

networks:
  dokploy-network:
    external: true
