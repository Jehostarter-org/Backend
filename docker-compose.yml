version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: jehostarter_db
    environment:
      POSTGRES_DB: jehostarter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Benjamin*247
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata: